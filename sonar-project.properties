sonar.projectKey=nknysh_cmc-tests
sonar.organization=nknysh
sonar.projectName=cmc-tests

# Specs are declared as *sources*, not sonar.tests: Sonar applies only a
# reduced rule set to test files, so this gives specs the full analysis.
sonar.sources=tests
sonar.exclusions=tests/contract/fixtures/**
sonar.sourceEncoding=UTF-8
# Specs have no coverage, so exclude everything from coverage: otherwise any
# new line under tests/ counts as 0% covered and fails a gate's coverage condition.
sonar.coverage.exclusions=**/*

sonar.typescript.tsconfigPaths=tsconfig.json
# ESLint + eslint-plugin-playwright findings, imported as external issues.
sonar.eslint.reportPaths=eslint-report.json

# Fail the scan step (and so the GitHub check) when the quality gate fails.
sonar.qualitygate.wait=true
