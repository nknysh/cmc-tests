name: API Tests

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One gh-pages publisher at a time; each workflow pushes to the same branch.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    # Two Allure suites, each with its own results/report/history (see
    # allurerc.mjs): 'contract' for tests/contract, 'api' for the functional
    # specs. Each test step selects its suite via ALLURE_SUITE.
    env:
      ALLURE_SUITES: contract api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # The btc-price-window self-heal's globalSetup runs here too (it fires for
      # every project) and audits any recentring with the same local GGUF model
      # the navigation heal uses - cache it so a price drift during this
      # workflow doesn't cold-download ~4.7GB.
      - name: Cache local GGUF model
        uses: actions/cache@v4
        with:
          path: .agents/coinmarketcap-navigation/models
          key: qwen2.5-coder-7b-instruct-q4_k_m-gguf

      # Contract tests go first: they check CMC's response shapes and the
      # client's request/mapping, so a break there explains API failures below.
      - name: Run contract tests
        run: npx playwright test --project=contract
        env:
          ALLURE_SUITE: contract
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          # The BTC price-window heal runs once, in the API tests step below.
          SKIP_BTC_PRICE_HEAL: '1'

      # Still runs when contracts fail, so the report shows both.
      - name: Run API tests
        if: success() || failure()
        run: npx playwright test --project=api
        env:
          ALLURE_SUITE: api
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      # Per-suite Allure history lives on gh-pages so each run's results accumulate.
      - name: Restore Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure reports
        if: always()
        run: |
          mkdir -p allure-history
          for suite in $ALLURE_SUITES; do
            [ -d "allure-results/$suite" ] || continue
            cp "gh-pages/allure-history/$suite.jsonl" allure-history/ 2>/dev/null || true
            ALLURE_SUITE=$suite npx allure generate "allure-results/$suite"
          done

      - name: Upload Allure results (contract)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-contract
          path: allure-results/contract/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Allure results (api)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results/api/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Allure reports to gh-pages
        if: always()
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || git worktree add --orphan -b gh-pages _pages
          [ -d _pages ] || git worktree add _pages gh-pages
          mkdir -p _pages/allure-history
          for suite in $ALLURE_SUITES; do
            [ -d "allure-report/$suite" ] || continue
            rm -rf "_pages/$suite"
            mkdir -p "_pages/$suite"
            cp -r "allure-report/$suite/." "_pages/$suite/"
            cp "allure-history/$suite.jsonl" _pages/allure-history/
          done
          # Old history shared by all suites; superseded by allure-history/<suite>.jsonl.
          rm -f _pages/allure-history.jsonl
          cp .github/allure-summary/index.html _pages/index.html
          cd _pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Allure reports (contract, api)" || exit 0
          git push origin gh-pages
