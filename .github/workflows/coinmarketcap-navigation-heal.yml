name: CoinMarketCap Navigation Self-Heal

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Cache local GGUF model
        uses: actions/cache@v4
        with:
          path: .agents/coinmarketcap-navigation/models
          key: qwen2.5-coder-7b-instruct-q4_k_m-gguf

      - run: node .agents/coinmarketcap-navigation/self-heal-navigation-locators.mts
        env:
          BASE_URL: https://coinmarketcap.com
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      # Kept regardless of outcome - a live-site test failure is only
      # debuggable after the fact if the screenshots/traces survive the run.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # Allure history lives on gh-pages so each run's results accumulate.
      - name: Restore Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        if: always()
        run: |
          cp gh-pages/allure-history.jsonl allure-history.jsonl 2>/dev/null || true
          npx allure generate allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Allure report to gh-pages
        if: always()
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || git worktree add --orphan -b gh-pages _pages
          [ -d _pages ] || git worktree add _pages gh-pages
          rm -rf _pages/navigation
          mkdir -p _pages/navigation
          cp -r allure-report/. _pages/navigation/
          cp allure-history.jsonl _pages/allure-history.jsonl
          cd _pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Allure report (navigation)" || exit 0
          git push origin gh-pages

      - name: Push healed locator if changed
        run: git push
