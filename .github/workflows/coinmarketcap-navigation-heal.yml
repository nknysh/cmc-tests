name: CoinMarketCap Navigation Self-Heal

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Cache local GGUF model
        uses: actions/cache@v4
        with:
          path: .agents/coinmarketcap-navigation/models
          key: qwen2.5-coder-7b-instruct-q4_k_m-gguf

      - run: node .agents/coinmarketcap-navigation/self-heal-navigation-locators.mts
        env:
          BASE_URL: https://coinmarketcap.com
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      # Kept regardless of outcome - a live-site test failure is only
      # debuggable after the fact if the screenshots/traces survive the run.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Push healed locator if changed
        run: git push
