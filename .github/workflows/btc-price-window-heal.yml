name: BTC Price Window Self-Heal

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# One gh-pages publisher at a time; each workflow pushes to the same branch.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    # Selects this suite's own Allure results/report/history (see allurerc.mjs),
    # so its published report never shows the other suites' results.
    env:
      ALLURE_SUITE: btc-price
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Cache local GGUF model
        uses: actions/cache@v4
        with:
          path: .agents/coinmarketcap-navigation/models
          key: qwen2.5-coder-7b-instruct-q4_k_m-gguf

      - run: ./node_modules/.bin/playwright test --project=btc-price
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      # Per-suite Allure history lives on gh-pages so each run's results accumulate.
      - name: Restore Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        if: always()
        run: |
          mkdir -p allure-history
          cp "gh-pages/allure-history/$ALLURE_SUITE.jsonl" allure-history/ 2>/dev/null || true
          ./node_modules/.bin/allure generate "allure-results/$ALLURE_SUITE"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-btc-price
          path: allure-results/btc-price/
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish Allure report to gh-pages
        if: always()
        run: |
          git fetch origin gh-pages:gh-pages 2>/dev/null || git worktree add --orphan -b gh-pages _pages
          [ -d _pages ] || git worktree add _pages gh-pages
          rm -rf _pages/btc-price
          mkdir -p _pages/btc-price _pages/allure-history
          cp -r "allure-report/$ALLURE_SUITE/." _pages/btc-price/
          cp "allure-history/$ALLURE_SUITE.jsonl" _pages/allure-history/
          # Old history shared by all suites; superseded by allure-history/<suite>.jsonl.
          rm -f _pages/allure-history.jsonl
          cp .github/allure-summary/index.html _pages/index.html
          cd _pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Allure report (btc-price)" || exit 0
          git push origin gh-pages

      - name: Push healed window if changed
        run: git push
