name: BTC Price Window Self-Heal

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - run: npx playwright test --project=btc-price
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}

      - name: Push healed window if changed
        run: git push
