<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMC Tests Summary</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#657084; --line:#e2e6ec; --pass:#1a7f4b; --fail:#c0392b; --other:#b7791f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161d; --card:#1b212b; --text:#e7ebf1; --muted:#95a0b3; --line:#2b3441; --pass:#4cc38a; --fail:#ff7b6b; --other:#e0b050; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:32px 16px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:1100px; margin:0 auto; }
  h1 { font-size:24px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(var(--cols,3),minmax(0,1fr)); gap:16px; }
  .card { min-width:0; overflow-wrap:anywhere; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
  .card h2 { font-size:17px; margin:0 0 12px; display:flex; flex-wrap:wrap; gap:6px; justify-content:space-between; align-items:center; }
  .badge { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; border:1px solid currentColor; text-transform:uppercase; }
  .passed { color:var(--pass); } .failed { color:var(--fail); } .other { color:var(--other); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; margin:0 0 16px; }
  dt { color:var(--muted); } dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  a { color:inherit; font-weight:600; }
  .err { color:var(--muted); }
  @media (max-width:640px) {
    body { padding:20px 16px; }
    .grid { gap:8px; }
    .card { padding:8px; font-size:11px; line-height:1.35; border-radius:8px; }
    .card h2 { font-size:12px; margin-bottom:6px; }
    .badge { font-size:9px; padding:0 5px; }
    dl { gap:1px 4px; margin-bottom:8px; }
    dd { font-weight:600; }
    .wide { grid-column:1 / -1; text-align:left; }
  }
</style>
</head>
<body>
<main>
  <h1>CMC Tests Summary</h1>
  <p class="sub">Latest Allure result of each suite. Open a report for full history and trends.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
const reports = [
  { title: 'BTC price window', path: 'btc-price/' },
  { title: 'Navigation e2e', path: 'navigation/' },
  { title: 'API functional', path: 'api/' },
  { title: 'API contract', path: 'contract/' },
  { title: 'Performance (k6)', path: 'perf/' },
];
const grid = document.getElementById('grid');
// Two rows: at least three columns, more as reports are added.
grid.style.setProperty('--cols', Math.max(3, Math.ceil(reports.length / 2)));

function row(k, v, cls = '') { return `<dt class="${cls}">${k}</dt><dd class="${cls}">${v}</dd>`; }

async function render({ title, path }) {
  const card = document.createElement('section');
  card.className = 'card';
  grid.appendChild(card);
  try {
    const res = await fetch(path + 'summary.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const s = await res.json();
    const st = s.stats || {};
    let cls = 'other';
    if (s.status === 'passed') {
      cls = 'passed';
    } else if (s.status === 'failed') {
      cls = 'failed';
    }
    const rest = (k) => st[k] ?? 0;
    card.innerHTML = `
      <h2>${title}<span class="badge ${cls}">${s.status ?? 'unknown'}</span></h2>
      <dl>
        ${row('Total', rest('total'))}
        ${row('Passed', rest('passed'))}
        ${row('Failed', rest('failed'))}
        ${row('Broken', rest('broken'))}
        ${row('Skipped', rest('skipped'))}
        ${row('Duration', ((s.duration ?? 0) / 1000).toFixed(1) + ' s')}
        ${row('Run at', s.createdAt ? new Date(s.createdAt).toLocaleString() : 'n/a', 'wide')}
      </dl>
      <a href="${path}">Open full report →</a>`;
  } catch {
    card.innerHTML = `<h2>${title}</h2><p class="err">No report published yet.</p>`;
  }
}
Promise.all(reports.map(render));
</script>
</body>
</html>
